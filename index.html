<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Облако точек — myscene.ply</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: sans-serif; }
        canvas { width: 100%; height: 100%; display: block; }
        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff; font-size: 20px; background: rgba(0,0,0,0.7);
            padding: 15px 25px; border-radius: 8px; pointer-events: none;
        }
        #info {
            position: absolute; bottom: 15px; left: 15px;
            color: rgba(255,255,255,0.7); font-size: 12px; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loading">Загрузка облака точек...</div>
    <div id="info">ЛКМ — вращение | ПКМ — панорама | Колёсико — зум</div>

    <!-- Three.js r128 (последняя версия с глобальными examples/js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/PLYLoader.js"></script>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 10000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const loader = new THREE.PLYLoader();

        loader.load('myscene.ply', function (geometry) {
            document.getElementById('loading').style.display = 'none';

            geometry.computeBoundingSphere();
            const radius = geometry.boundingSphere.radius;
            const calculatedPointSize = Math.max(0.005, radius * 0.003);

            const material = new THREE.PointsMaterial({
                size: calculatedPointSize,
                vertexColors: geometry.hasAttribute('color'),
                transparent: true,
                opacity: 0.9,
                sizeAttenuation: true
            });

            const points = new THREE.Points(geometry, material);
            scene.add(points);

            const center = geometry.boundingSphere.center;
            controls.target.copy(center);
            camera.position.set(center.x, center.y + radius * 0.5, center.z + radius * 1.5);
            controls.update();
        },
        function (xhr) {
            if (xhr.total > 0) {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                document.getElementById('loading').innerText = `Загрузка: ${percent}%`;
            } else {
                document.getElementById('loading').innerText = `Загружено: ${(xhr.loaded / 1024 / 1024).toFixed(1)} МБ`;
            }
        },
        function (error) {
            document.getElementById('loading').innerText = 'Ошибка: не удалось загрузить myscene.ply';
            console.error(error);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
